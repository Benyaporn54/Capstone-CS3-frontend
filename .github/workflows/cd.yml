name: Frontend CD

# Deploy ขึ้น SIT VM เมื่อ CI ผ่านบน main (ต้องกด Approve ที่ Environment "production")
# หรือรันมือ (workflow_dispatch) เพื่อ rollback โดยระบุ image tag เช่น sha-abc1234
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag ที่จะ deploy/rollback (เว้นว่าง = build จาก main ล่าสุด)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/planit-frontend

jobs:
  build:
    # รันเฉพาะเมื่อ CI ของ push บน main ผ่าน (ไม่รับ PR/fork) หรือสั่งมือ
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Resolve tag
        id: vars
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            [[ "$INPUT_TAG" =~ ^[A-Za-z0-9._-]{1,128}$ ]] || { echo "invalid tag"; exit 1; }
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${RUN_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.vars.outputs.build == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3
        if: steps.vars.outputs.build == 'true'

      - uses: docker/login-action@v3
        if: steps.vars.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.vars.outputs.build == 'true'
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production # ← Required reviewers ตั้งที่ Settings > Environments
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy on VM
        env:
          HOST: ${{ secrets.VM_HOST }}
          USER_: ${{ secrets.VM_USER }}
          PORT: ${{ secrets.VM_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/planit' }}
          SERVICE: ${{ vars.FRONTEND_SERVICE || 'frontend' }}
          TAG: ${{ needs.build.outputs.tag }}
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=yes -o BatchMode=yes $USER_@$HOST"
          # token ส่งผ่าน stdin เท่านั้น ไม่โผล่ใน command line/log
          printf '%s' "$GH_TOKEN" | $SSH "docker login ghcr.io -u '$GH_USER' --password-stdin"
          $SSH bash -s -- "$DEPLOY_PATH" "$SERVICE" "$IMAGE" "$TAG" <<'REMOTE'
          set -euo pipefail
          path="$1"; svc="$2"; image="$3"; tag="$4"
          docker pull "$image:$tag"
          docker tag "$image:$tag" "$image:latest"
          cd "$path"
          docker compose up -d --no-deps --no-build "$svc"
          docker image prune -f >/dev/null
          docker logout ghcr.io
          REMOTE

      - name: Health check
        env:
          URL: ${{ vars.FRONTEND_HEALTH_URL }}
        run: |
          [ -n "$URL" ] || { echo "ไม่ได้ตั้งค่า health URL ข้าม"; exit 0; }
          for i in $(seq 1 20); do
            curl -fsS --max-time 10 "$URL" >/dev/null && { echo "healthy"; exit 0; }
            sleep 6
          done
          echo "health check failed — พิจารณา rollback ด้วย workflow_dispatch (tag เดิม)"; exit 1
